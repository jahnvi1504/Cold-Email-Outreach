services:
  - type: web
    name: reachinbox-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
  - type: web
    name: reachinbox-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
